<div class="para" id="signature1-2-2-1">The image consists of six cellos radiating outward as if they form an asterisk. The tops of the necks of each cello intersect in sets of three. The cello asterisks repeat indefinitely left and right such that two, adjacent asterisks meet at the tips of two of their necks. The cello asterisks also repeat indefinitely up-right and down-left (at sixty degrees) such that two, adjacent asterisks meet at the tips of two of their necks. In the space between the cello asterisks, are a set of four bass clefs mirroring each other at right angles. Lines indicate six fold mirror symmetry thru the center of each cello asterisk as well as three fold mirror symmetry through the meetings of the tips of three cellos. Another two fold mirror symmetry is between the bass clefs.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#signature1-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
