<li>
<div class="para">(<em class="emphasis">Playfair</em>) Given a line and a point not on that line, there exists exactly one line through that point parallel to the given line.</div>
<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#list-equivalent-euclidean-postulates-2-1" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
<li>
<div class="para">(<em class="emphasis">Equidistance</em>) Lines that are parallel are everywhere equidistant.</div>
<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#list-equivalent-euclidean-postulates-2-2" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
<li>
<div class="para">(<em class="emphasis">Euclid</em>) Given two lines and a transversal of those lines, if the sum of the angles on one side of the transversal is less than two right angles then the lines meet on that side.</div>
