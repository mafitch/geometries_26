<div class="para" id="signature2-2-2-1">The image consists of pairs of french horn like shapes. Each pair are arranged so that the bells touch each other, but one is rotate 180 degrees from the other. These pairs fill a rectangular area. Those rectangles repeat indefinitely in a rectangular grid pattern. Left to right they repeat indefinitely by translation. Up and down they repeat by reflection. A horizontal line indicates the mirror symmetry. A symbol where the bells meet indicates the 180 degree rotational symmetry. The same symbol between two rectangular regions indicates another 180 degree rotation symmetry.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#signature2-2-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
